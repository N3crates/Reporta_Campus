<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <main class="bg-white w-full max-w-md rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">
            Crear cuenta
        </h1>
        <p class="text-slate-500 text-sm mb-6">
            Registrate como reportante
        </p>
        <div id="alert-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200"></div>
        <form id="form-registro" class="space-y-4">
            <div>
                <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">
                    Nombre
                </label>
                <input 
                    type="text" 
                    id="nombre" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" 
                    />
            </div>
            <div>
                <label for="correo" class="block text-sm font-medium text-slate-700 mb-1">
                    Correo
                </label>
                <input 
                    type="email" 
                    id="correo" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" 
                    />
            </div>
            <div>
                <label for="password class="block text-sm font-medium text-slate-700 mb-1">
                    Contraseña
                </label>
                <input 
                    type="password" 
                    id="password"
                    required minlength="6"
                    placeholder="Minimo 6 caracteres" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" 
                    />
            </div>
            <button
                type="submit"
                id="btn-submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 5 rounded-lg transition"
                >
                Registrar
            </button>
        </form>
        <p class="text-center text-sm text-slate-600 mt-6">
            ¿Ya tienes cuenta?
            <a href="login.html" class="text-blue-600 font-medium hover:underline">
                Iniciar Sesion
            </a>
        </p>
    </main>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>

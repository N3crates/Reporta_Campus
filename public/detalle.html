<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <meta
            name="description"
            content="ReportaCampus: reporta y da seguimiento a las incidencias de mantenimiento de tu campus."
        />
        <meta
            name="theme-color"
            content="#0a263d"
        />
        <title>Detalle de incidencia · ReportaCampus</title>
        <link
            rel="icon"
            href="assets/favicon.svg"
            type="image/svg+xml"
        />
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            rel="stylesheet"
            href="css/styles.css"
        />
    </head>
    <body class="min-h-screen flex flex-col">
        <a
            class="skip-link"
            href="#contenido"
        >
            Saltar al contenido
        </a>
        <div id="encabezado"></div>
        <main
            id="contenido"
            class="flex-1 w-full max-w-7xl mx-auto px-5 sm:px-8 py-8 sm:py-12"
            tabindex="-1"
        >
            <nav
                aria-label="Ruta de navegación"
                class="flex flex-wrap gap-2 text-xs text-stone-500 mb-7"
            >
                <a
                    href="incidencias.html"
                    class="hover:underline"
                >
                    Incidencias
                </a>
                <span aria-hidden="true">/</span>
                <span>Detalle del reporte</span>
            </nav>
            <div id="detalle-contenido">
                <p
                    role="status"
                    class="text-sm text-stone-500"
                >
                    Cargando el reporte…
                </p>
            </div>
            <noscript>
                <p class="panel p-6">
                    Activa JavaScript para consultar el detalle de la incidencia.
                    <a
                        class="underline"
                        href="incidencias.html"
                    >
                        Volver al listado
                    </a>
                    .
                </p>
            </noscript>
        </main>
        <div id="pie-pagina"></div>
        <script
            type="module"
            src="js/ui.js"
        ></script>
        <script
            type="module"
            src="js/pages/detalle.js"
        ></script>
    </body>
</html>

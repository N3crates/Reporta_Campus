<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Administracion</title>
        <link
            rel="icon"
            href="assets/favicon.svg"
            type="image/svg+xml"
        />
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link
            rel="stylesheet"
            href="css/styles.css"
        />
    </head>
    <body class="min-h-screen flex flex-col">
        <div id="encabezado"></div>
        <main
            id="contenido-admin"
            class="hidden flex-1 max-w-7xl w-full mx-auto px-5 sm:px-8 py-10 space-y-8"
        >
            <div
                class="flex flex-wrap items-end justify-between gap-4 border-b border-slate-200 pb-5"
            >
                <div>
                    <span class="eyebrow">Panel de control</span>
                    <h1 class="text-3xl font-extrabold text-[#0a263d] mt-1">
                        Administracion de Usuarios
                    </h1>
                    <p class="text-sm text-slate-600 mt-1">
                        Editar, asigna roles o eliminar cuentas
                    </p>
                </div>
            </div>
            <div
                id="alerta-admin"
                class="hidden admin-alert"
            ></div>
            <section class="panel p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-extrabold text-[#0a263d]">Usuarios y Roles</h2>
                    <span
                        id="contador-usuarios"
                        class="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded"
                    >
                        0 Usuarios
                    </span>
                </div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <tr>
                                <td
                                    colspan="4"
                                    class="py-6 text-center text-slate-500"
                                >
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div
            id="modal-editar-usuario"
            class="hidden modal-backdrop"
        >
            <div class="modal-card space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="text-lg font-extrabold text-[#0a263d]">Editar usuario</h3>
                    <button
                        id="btn-cerrar-modal"
                        type="button"
                        class="text-slate-400 hover:text-slate-700 text-xl font-bold leading-none"
                    >
                        &times;
                    </button>
                </div>
                <form
                    id="form-editar-usuario"
                    class="space-y-4"
                >
                    <input
                        type="hidden"
                        id="edit-uid"
                    />
                    <div>
                        <label
                            for="edit-correo"
                            class="field-label text-slate-500"
                        >
                            Correo
                        </label>
                        <input
                            type="email"
                            id="edit-correo"
                            disabled
                            class="field bg-slate-100 text-slate-500 cursor-not-allowed"
                        />
                    </div>
                    <div>
                        <label
                            for="edit-nombre"
                            class="field-label"
                        >
                            Nombre completo
                        </label>
                        <input
                            type="text"
                            id="edit-nombre"
                            required
                            class="field"
                        />
                    </div>
                    <div>
                        <label
                            for="edit-rol"
                            class="field-label"
                        >
                            Rol
                        </label>
                        <select
                            id="edit-rol"
                            class="field"
                        >
                            <option value="reportante">Reportante</option>
                            <option value="responsable">Responsable</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button
                            id="btn-cancelar-modal"
                            type="button"
                            class="btn-secondary"
                        >
                            Cancelar
                        </button>
                        <button
                            type="submit"
                            class="btn-primary"
                        >
                            Guardar cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div id="pie-pagina"></div>
        <script
            type="module"
            src="js/ui.js"
        ></script>
        <script
            type="module"
            src="js/pages/admin.js"
        ></script>
    </body>
</html>

<div
    data-sesion-publica
    class="flex flex-wrap gap-3 items-center"
>

        href="login.html"
        class="nav-access"
    >
        Iniciar sesión
    </a>
    <a
        href="registro.html"
        class="nav-register"
    >
        Crear cuenta ↗
    </a>
</div>
<div

    hidden
    class="session-user"
>

            class="session-name"
        ></span>
        <span

        id="btn-cerrar-sesion"

        class="nav-access"
    >

<p
    data-error-sesion

    role="alert"
    class="text-xs text-[#ffd300] max-w-xs"
></p>

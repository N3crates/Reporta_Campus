<text x="300" y="690" class="h">ADAPTACIÓN MÓVIL</text>
<text x="300" y="730" class="label">Menú colapsable con botón accesible y cierre con Escape.</text>
<text x="300" y="762" class="label">Las columnas pasan a una sola columna según el espacio disponible.</text>
<text x="300" y="794" class="label">Los filtros y campos ocupan el ancho disponible.</text>
<text x="300" y="826" class="label">Las tarjetas evitan tablas anchas y desbordamiento horizontal.</text>
<text x="300" y="858" class="label">Los textos largos pueden partirse sin ocultar contenido.</text>
<text x="300" y="890" class="label">Se contemplan validación, éxito, lista vacía y detalle no encontrado.</text>
<text x="300" y="940" class="label">Tipografía final: Plus Jakarta Sans · Tailwind CSS por CDN · HTML y JavaScript sin frameworks</text>
